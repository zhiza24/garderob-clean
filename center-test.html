<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Что в центре твоего мира</title>
<style>
:root { --bg:#0f1419; --card:#1a1f26; --accent:#3b82f6; --text:#e8edf3; --muted:#8b97a8; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
.container { max-width:680px; margin:0 auto; padding:20px; }
h1 { font-size:22px; margin:0 0 8px; }
.sub { color:var(--muted); font-size:14px; margin-bottom:24px; }
.card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:16px; }
.q { font-weight:600; margin-bottom:12px; }
.options { display:flex; flex-direction:column; gap:8px; }
.opt { background:#232a33; border:1px solid #2e3744; border-radius:8px; padding:12px; cursor:pointer; transition:0.15s; }
.opt:hover, .opt.selected { border-color:var(--accent); background:#1e3a5f; }
.btn { width:100%; padding:14px; background:var(--accent); color:white; border:none; border-radius:10px; font-weight:600; font-size:16px; cursor:pointer; margin-top:8px; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.result { display:none; }
.bar { height:10px; background:#2e3744; border-radius:5px; margin:8px 0 16px; overflow:hidden; }
.bar > div { height:100%; background:var(--accent); }
.center-score { font-size:32px; font-weight:700; color:var(--accent); }
.strategy { background:#1e293b; border-left:3px solid var(--accent); padding:12px 14px; border-radius:0 8px 8px 0; margin-top:12px; }
</style>
</head>
<body>
<div class="container">
  <h1>Что стоит в центре твоего мира</h1>
  <div class="sub">Отвечай так, как ты реально поступаешь или хочешь поступить. Есть варианты «мне проще вообще не вступать в контакт».</div>

  <div id="quiz"></div>
  <button class="btn" id="next" disabled>Далее</button>

  <div class="result" id="result">
    <div class="card">
      <div>Насколько ты в центре своего мира</div>
      <div class="center-score" id="score">0%</div>
      <div class="bar"><div id="bar"></div></div>
      <div id="interp"></div>
    </div>
    <div class="card">
      <div id="strategy"></div>
    </div>
  </div>
</div>

<script>
const questions = [
  {
    q: "Друг просит помочь с переездом в единственный свободный вечер, который ты уже планировал провести в одиночестве. Ты:",
    opts: [
      { t: "Соглашаюсь, потом как-нибудь отдохну", s: 0, tag: "people" },
      { t: "Говорю, что занят, но чувствую вину весь вечер", s: 1, tag: "guilt" },
      { t: "Честно говорю, что этот вечер нужен мне, и предлагаю другой день", s: 2, tag: "center" },
      { t: "Отказываю коротко и без объяснений", s: 2, tag: "center" },
      { t: "Мне проще вообще не отвечать / исчезнуть из переписки", s: 1, tag: "avoid" }
    ]
  },
  {
    q: "В компании все выбирают ресторан, который тебе не нравится. Ты:",
    opts: [
      { t: "Молчу и иду", s: 0, tag: "people" },
      { t: "Говорю «мне всё равно», хотя не всё равно", s: 0, tag: "people" },
      { t: "Предлагаю альтернативу и спокойно держу свою позицию", s: 2, tag: "center" },
      { t: "Иду, но внутри злюсь на себя", s: 1, tag: "guilt" },
      { t: "Мне проще не идти вообще и остаться дома", s: 1, tag: "avoid" }
    ]
  },
  {
    q: "Тебе предлагают работу или проект, который выгоден по деньгам, но сильно против твоих ценностей. Первая реакция:",
    opts: [
      { t: "Беру, деньги важнее", s: 0, tag: "people" },
      { t: "Долго сомневаюсь и в итоге соглашаюсь", s: 1, tag: "guilt" },
      { t: "Сразу отказываю", s: 2, tag: "center" },
      { t: "Беру, но потом сильно жалею и злюсь на себя", s: 0, tag: "guilt" },
      { t: "Игнорирую предложение и не отвечаю", s: 1, tag: "avoid" }
    ]
  },
  {
    q: "Кто-то перебивает тебя в разговоре и продолжает свою мысль. Ты обычно:",
    opts: [
      { t: "Замолкаю и слушаю до конца", s: 0, tag: "people" },
      { t: "Жду паузы и осторожно пытаюсь вернуться", s: 1, tag: "guilt" },
      { t: "Спокойно говорю: «Я ещё не закончил(а)»", s: 2, tag: "center" },
      { t: "Внутри обижаюсь, но внешне улыбаюсь и молчу", s: 0, tag: "people" },
      { t: "Мне проще выйти из разговора или перестать участвовать", s: 1, tag: "avoid" }
    ]
  },
  {
    q: "Ты очень устал(а), а близкий человек хочет поговорить «прямо сейчас». Ты:",
    opts: [
      { t: "Остаюсь и слушаю, хотя сил нет", s: 0, tag: "people" },
      { t: "Говорю, что устал(а), но всё равно остаюсь", s: 1, tag: "guilt" },
      { t: "Честно говорю, что сейчас не могу, и предлагаю другое время", s: 2, tag: "center" },
      { t: "Ухожу / кладу трубку и потом чувствую вину", s: 1, tag: "guilt" },
      { t: "Мне проще не брать трубку и написать позже «был(а) занят(а)»", s: 1, tag: "avoid" }
    ]
  },
  {
    q: "Представь, что ты можешь выбрать только одно. Что для тебя важнее прямо сейчас?",
    opts: [
      { t: "Чтобы окружающие были мной довольны", s: 0, tag: "people" },
      { t: "Чтобы не возникало конфликтов и напряжения", s: 0, tag: "people" },
      { t: "Чтобы я сам(а) был(а) согласен(на) со своим выбором", s: 2, tag: "center" },
      { t: "Чтобы потом не жалеть о том, что предал(а) себя", s: 2, tag: "center" },
      { t: "Чтобы меня вообще не трогали и не вовлекали", s: 1, tag: "avoid" }
    ]
  },
  {
    q: "Когда ты в последний раз отказал(а) кому-то в важном для него ради себя — что было после?",
    opts: [
      { t: "Сильная вина и желание как-то компенсировать", s: 0, tag: "guilt" },
      { t: "Облегчение, но с неприятным осадком", s: 1, tag: "guilt" },
      { t: "Спокойствие и ощущение, что всё правильно", s: 2, tag: "center" },
      { t: "Почти никогда так не делаю", s: 0, tag: "people" },
      { t: "Я обычно просто избегаю ситуаций, где надо отказывать", s: 1, tag: "avoid" }
    ]
  },
  {
    q: "Тебе пишут в мессенджере с просьбой или вопросом, на который не хочется отвечать. Ты чаще:",
    opts: [
      { t: "Отвечаю сразу, даже если не хочется", s: 0, tag: "people" },
      { t: "Откладываю, но потом всё равно отвечаю с чувством долга", s: 1, tag: "guilt" },
      { t: "Отвечаю коротко и по делу, когда готов(а)", s: 2, tag: "center" },
      { t: "Не отвечаю и чувствую себя виноватым", s: 1, tag: "guilt" },
      { t: "Мне проще проигнорировать — так меньше энергозатрат", s: 1, tag: "avoid" }
    ]
  }
];

let current = 0;
let answers = [];
let tags = { people: 0, guilt: 0, center: 0, avoid: 0 };

function render() {
  const q = questions[current];
  document.getElementById('quiz').innerHTML = `
    <div class="card">
      <div class="q">${current+1} из ${questions.length}. ${q.q}</div>
      <div class="options">
        ${q.opts.map((o,i) => `<div class="opt" data-i="${i}">${o.t}</div>`).join('')}
      </div>
    </div>`;
  document.querySelectorAll('.opt').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('.opt').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('next').disabled = false;
    };
  });
  document.getElementById('next').disabled = true;
  document.getElementById('next').textContent = current === questions.length - 1 ? 'Показать результат' : 'Далее';
}

document.getElementById('next').onclick = () => {
  const sel = document.querySelector('.opt.selected');
  if (!sel) return;
  const opt = questions[current].opts[+sel.dataset.i];
  answers.push(opt.s);
  tags[opt.tag] = (tags[opt.tag] || 0) + 1;
  current++;
  if (current < questions.length) render();
  else showResult();
};

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('next').style.display = 'none';
  const max = questions.length * 2;
  const sum = answers.reduce((a, b) => a + b, 0);
  const pct = Math.round((sum / max) * 100);
  document.getElementById('score').textContent = pct + '%';
  document.getElementById('bar').style.width = pct + '%';

  let interp = '';
  if (pct < 30) interp = 'В центре твоего мира сейчас преимущественно другие люди и их комфорт (или избегание любого напряжения с ними). Ты часто предаёшь свой выбор автоматически. Это не «доброта», а закреплённая стратегия выживания, которая съедает энергию.';
  else if (pct < 55) interp = 'Ты частично возвращаешь себе центр, но часто откатываешься. Есть и прямое подстраивание, и уход в избегание («мне проще не общаться»). Вина или привычка быстро возвращают старую схему.';
  else if (pct < 75) interp = 'Ты уже довольно часто ставишь себя в центр. Решения чаще проходят через «что я выбираю». Остаются зоны, где включается либо подстройка, либо избегание.';
  else interp = 'Ты в основном в центре своего мира. Умеешь выбирать себя без долгой внутренней войны. Это рабочая и устойчивая позиция.';

  document.getElementById('interp').textContent = interp;

  let strategy = '<strong>Твоя стратегия на ближайшие 2–3 недели:</strong><div class="strategy">';
  const dominant = Object.entries(tags).sort((a,b) => b[1] - a[1])[0][0];

  if (dominant === 'people' || tags.people >= 3) {
    strategy += 'Основной паттерн — подстройка под других.<br><br>';
    strategy += '1. Каждый день один маленький отказ без длинного объяснения (даже в мелочи).<br>';
    strategy += '2. Перед автоматическим «да» — пауза 10 секунд и вопрос: «Если бы никто не обиделся, я бы согласился?»<br>';
    strategy += '3. Замечай вину после своего выбора и не беги её сразу «исправлять».';
  } else if (dominant === 'avoid' || tags.avoid >= 3) {
    strategy += 'Основной паттерн — избегание контакта («мне проще не общаться»).<br><br>';
    strategy += '1. Вместо полного игнора — одна короткая честная фраза в день («сейчас не могу», «не хочу это обсуждать»).<br>';
    strategy += '2. Выбери одну сферу, где ты готов(а) чуть больше присутствовать, и одну, где осознанно оставляешь дистанцию.<br>';
    strategy += '3. Отслеживай: избегание даёт облегчение или потом накапливается напряжение?';
  } else if (dominant === 'guilt' || tags.guilt >= 3) {
    strategy += 'Основной паттерн — вина после своего выбора.<br><br>';
    strategy += '1. Когда появляется вина — не действуй сразу. Подожди 20–30 минут.<br>';
    strategy += '2. Записывай: «Я выбрал(а) себя. Вина есть. Я всё равно не отменяю выбор».<br>';
    strategy += '3. Одна граница в день + наблюдение за виной без компенсации.';
  } else {
    strategy += 'У тебя уже есть опора на свой выбор.<br><br>';
    strategy += '1. Замечай оставшиеся автоматические «да» или уходы в игнор.<br>';
    strategy += '2. Укрепляй навык короткого честного ответа вместо подстройки или исчезновения.<br>';
    strategy += '3. Раз в неделю проверяй: решения по-прежнему проходят через «что я выбираю»?';
  }
  strategy += '</div>';
  document.getElementById('strategy').innerHTML = strategy;
  document.getElementById('result').style.display = 'block';
}

render();
</script>
</body>
</html>
